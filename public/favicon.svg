<!-- Ace Studio favicon: the app's own mark — a lemon-green
     gradient tile (#A3E635 → #BEF264, 135°, same as --gradient-primary
     in src/styles.css) with a dark "A", on the app's dark #0F0F12.
     Recolored from yellow to lemon green, 2026-11-08. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3E635" />
      <stop offset="1" stop-color="#BEF264" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0F0F12" />
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#g)" />
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Bricolage Grotesque, Arial, sans-serif"
    font-size="36"
    font-weight="800"
    fill="#0F0F12"
  >A</text>
</svg>
